name: Verify blue portfolio and capture live previews
on:
  push:
    branches: [redesign/blue-portfolio]
    paths: ['src/**','scripts/verify-blue.mjs','scripts/blue-preview-targets.json','.github/workflows/blue-portfolio.yml','next.config.ts']
  workflow_dispatch:
concurrency:
  group: blue-portfolio-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build
        run: |
          npm install
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y python3-pil
          npm run build
      - name: Verify and capture
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/portfolio-blue.log 2>&1 &
          for i in $(seq 1 30); do if curl -fsSL http://127.0.0.1:3000/coding >/dev/null; then break; fi; sleep 2; done
          node scripts/verify-blue.mjs
      - name: Commit live screenshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/img/actual src/lib/preview-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Capture current website screenshots and coding/editing previews'
          git push origin HEAD:${GITHUB_REF_NAME}
