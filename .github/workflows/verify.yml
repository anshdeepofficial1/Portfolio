name: Portfolio verification
on:
  push:
    branches: [main, maintenance/portfolio-cleanup]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install
        run: npm install
      - name: Render previews from original PDFs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          for kind in coding editing; do
            pdftoppm -f 1 -l 1 -r 144 -png -singlefile "public/resumes/resume_${kind}.pdf" "public/resumes/resume_${kind}"
            pdfinfo "public/resumes/resume_${kind}.pdf" | grep Pages
          done
      - name: Build and verify
        run: |
          npm run build
          npm run start -- --hostname 127.0.0.1 > /tmp/portfolio.log 2>&1 &
          for i in $(seq 1 30); do if curl -fsSL http://127.0.0.1:3000/coding >/dev/null; then break; fi; sleep 2; done
          node scripts/verify-portfolio.mjs
      - name: Save generated previews on cleanup branch
        if: github.ref == 'refs/heads/maintenance/portfolio-cleanup'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/resumes/*.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Generate previews of both original resume PDFs'
          git push origin HEAD:maintenance/portfolio-cleanup
