name: Capture actual portfolio previews
on:
  push:
    branches: [redesign/original-motion-portfolio]
    paths:
      - 'scripts/preview-targets.json'
      - 'scripts/capture-previews.mjs'
      - '.github/workflows/actual-previews.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install capture dependencies
        run: |
          npm install
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils python3-pil
      - name: Run actual NOVA shell from public source
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/anshdeepofficial1/NOVA.git /tmp/nova-portfolio-preview
          cd /tmp/nova-portfolio-preview
          npm install
          npm run dev --workspace @nova/shell -- --port 4173 > /tmp/nova-preview.log 2>&1 &
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi; sleep 2; done
          cat /tmp/nova-preview.log
          exit 1
      - name: Build and serve portfolio
        run: |
          npm run build
          npm run start -- --hostname 127.0.0.1 > /tmp/portfolio-preview.log 2>&1 &
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi; sleep 2; done
          cat /tmp/portfolio-preview.log
          exit 1
      - name: Capture actual public project pages and resume
        run: node scripts/capture-previews.mjs
      - name: Commit verified preview assets
        run: |
          find public/img/actual -name '*.source' -delete
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/img/actual src/lib/preview-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Capture real project previews and original PDF thumbnail'
          git push origin HEAD:${GITHUB_REF_NAME}
