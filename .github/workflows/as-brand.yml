name: Verify AS branding and refresh screenshots
on:
  push:
    branches: [redesign/as-brand]
    paths:
      - 'src/**'
      - 'public/as-logo.svg'
      - 'scripts/test-brand.mjs'
      - '.github/workflows/as-brand.yml'
  workflow_dispatch:
concurrency:
  group: as-brand-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install and build
        run: |
          npm install
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y python3-pil
          npm run build
      - name: Verify browser, WebGL shader and mobile layout
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/portfolio-brand.log 2>&1 &
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:3000/ >/dev/null; then break; fi; sleep 2; done
          node scripts/test-brand.mjs
      - name: Commit transparent PNG and actual homepage screenshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/as-logo.png public/favicon.png public/img/actual/portfolio.jpg public/img/actual/portfolio-blueprint.jpg public/img/actual/portfolio-mobile.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh actual AS portfolio previews and transparent logo'
          git push origin HEAD:${GITHUB_REF_NAME}
